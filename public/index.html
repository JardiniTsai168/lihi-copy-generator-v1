<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>著色圖產生器 | lihi 實驗室</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>

    <main class="shell">
      <section class="hero">
        <div class="hero-title-row">
          <div class="hero-copy">
            <div class="hero-title-inline">
              <h1 class="hero-title">著色圖產生器 | lihi 實驗室</h1>
            </div>
            <p class="hero-subtitle">上傳一張溫馨的照片，給你的孩子一張有意義的著色圖。</p>
          </div>
          <div class="hero-meta">
            <p class="hero-powered">
              Powered by
              <a href="https://lihi.io" target="_blank" rel="noreferrer">lihi.io</a>
            </p>
            <span class="chip chip-secondary" id="mode-badge">連線檢查中</span>
          </div>
        </div>
        <div class="hero-layout">
          <form class="panel panel-form hero-form" id="coloring-form" novalidate>
            <label class="upload-dropzone" for="photo-input" id="upload-dropzone">
              <input id="photo-input" name="photo" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden />
              <span class="upload-label">拖拉照片到這裡，或點一下選圖</span>
              <span class="upload-limit">一次最多可上傳 3 張</span>
            </label>
            <small class="error" data-error-for="photo"></small>

            <div class="upload-preview is-hidden" id="upload-preview">
              <div class="upload-preview-toolbar">
                <button class="ghost-button upload-remove-button" type="button" id="remove-photo-button">清空照片</button>
              </div>
              <div class="source-preview-grid" id="source-preview-grid"></div>
            </div>

            <div class="actions">
              <button class="primary-button" type="submit" id="submit-button">產出著色圖</button>
              <p class="status is-hidden" id="form-status"></p>
            </div>
          </form>

          <section class="panel panel-examples" aria-labelledby="example-title">
            <div class="example-head">
              <h2 id="example-title">範例</h2>
            </div>

            <div class="example-grid">
              <figure class="example-card">
                <figcaption class="example-caption">狗狗照片 → 著色圖</figcaption>
                <div class="example-pair">
                  <img
                    class="example-image"
                    src="./examples/small/dog1.jpg"
                    alt="狗狗原始照片範例"
                    loading="lazy"
                    decoding="async"
                  />
                  <img
                    class="example-image"
                    src="./examples/small/dog1_color.png"
                    alt="狗狗著色圖範例"
                    loading="lazy"
                    decoding="async"
                  />
                </div>
              </figure>
            </div>
          </section>
        </div>
      </section>

      <section class="stack">

        <section class="panel panel-output">
          <div class="panel-head panel-head-inline">
            <div>
              <h2>著色圖預覽</h2>
            </div>
          </div>

          <div class="preview-card empty" id="result-card">
            <div class="empty-state" id="empty-state">
              <p class="empty-copy is-hidden" id="empty-loading-message">圖片產生中，請稍候。</p>
              <div class="loading-bar is-hidden" id="empty-loading-bar" aria-hidden="true">
                <span class="loading-bar-track"></span>
              </div>
              <figure class="example-card example-card-inline" id="empty-example-card">
                <figcaption class="example-caption">釣魚照片 → 著色圖</figcaption>
                <div class="example-pair">
                  <img
                    class="example-image"
                    src="./examples/small/fish.jpg"
                    alt="魚與釣竿原始照片"
                    loading="lazy"
                    decoding="async"
                  />
                  <img
                    class="example-image"
                    src="./examples/small/fish_color.png"
                    alt="魚與釣竿著色圖"
                    loading="lazy"
                    decoding="async"
                  />
                </div>
              </figure>
            </div>
            <div class="result-gallery is-hidden" id="result-gallery"></div>
          </div>
        </section>
      </section>

      <section class="site-meta">
        <div class="meta-grid">
          <div class="meta-card">
            <span class="meta-label">生成模型</span>
            <strong id="model-name">-</strong>
          </div>
          <div class="meta-card">
            <span class="meta-label">本次費用</span>
            <strong id="cost-name">-</strong>
          </div>
          <div class="meta-card">
            <span class="meta-label">輸出模式</span>
            <strong id="mode-name">-</strong>
          </div>
          <div class="meta-card">
            <span class="meta-label">產出耗時</span>
            <strong id="generated-at">-</strong>
          </div>
        </div>
      </section>

      <footer class="site-disclaimer">
        <p>免責聲明：我們不保留任何上傳照片，亦不對產出圖片的內容或版權負責。</p>
        <p>利害短網址有限公司 | 2017 年成立，服務超過 5,000+ 品牌</p>
        <p>© 2018-2026 統編 82908327</p>
      </footer>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
